name: Terraform CI/CD


on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths: 
      - "terraform/**"

jobs:
  terraform:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform/environments/dev
    env:
      GCP_PROJECT_ID: ${{ secrets.GCP_DEV_PROJECT_ID }}
      GCP_SERVICE_ACCOUNT: ${{ secrets.GCP_DEV_SERVICE_ACCOUNT }}
      GCP_REGION: ${{ secrets.GCP_DEV_REGION }}
      GCP_ZONE: ${{ secrets.GCP_DEV_ZONE }}
      GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ secrets.GCP_DEV_WORKLOAD_IDENTITY_PROVIDER }}
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v1
        with:
          workload_identity_provider: ${{ env.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.GCP_SERVICE_ACCOUNT }}
          project_id: ${{ env.GCP_PROJECT_ID }}

      - name: Terraform Format
        run: terraform fmt -check -recursive
      
      - name: Terraform Init
        run: terraform init

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        run: terraform plan
